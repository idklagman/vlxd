services:
  postgres:
    image: postgres:16-alpine
    container_name: vlxd-postgres
    environment:
      POSTGRES_DB: vlxd
      POSTGRES_USER: vlxd
      POSTGRES_PASSWORD: vlxd_password
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vlxd -d vlxd"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
